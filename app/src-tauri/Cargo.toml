[package]
name = "app"
version = "1.0.0-rc.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noyalib = { version = "0.0.19", features = ["compat-serde-yaml"] }
walkdir = "2.5.0"
sha2 = "0.11.0"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
libc = "0.2.189"
fs2 = "0.4.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
zip = { version = "8.6.0", features = ["deflate"] }
reqwest = { version = "0.13", default-features = true, features = ["blocking", "json", "socks"] }
font-kit = { version = "0.14", default-features = true, features = ["source-fontconfig-dlopen"] }
keyring = "4.1.6"

[dev-dependencies]
tempfile = "3.27.0"

