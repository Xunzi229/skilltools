name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            # MSI/WiX 要求 pre-release 标识为纯数字（<=65535），如 0.8.0-1。
            # 含 preview/rc 字母时仅打 NSIS，避免整 job 失败。
            args: ""
            portable_arch: x64
          # Windows ARM64：原生构建（MSI 不支持 ARM64，仅 NSIS + portable）
          - platform: windows-11-arm
            args: --target aarch64-pc-windows-msvc --bundles nsis
            portable_arch: arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.platform == 'windows-11-arm' && 'aarch64-pc-windows-msvc') || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and upload release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Skill Manager ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}${{ (contains(github.ref_name, 'preview') || contains(github.ref_name, '-rc')) && ' (Preview)' || '' }}
          releaseBody: |
            Preview / 预览版：含尚未正式发布的功能，仅供测试。
            多平台安装包（Windows / macOS / Linux）：
            - Windows：
              - `..._windows-x64-setup.exe` / `..._windows-arm64-setup.exe`：NSIS 安装包（x64 正式版另有 `.msi`；支持应用内更新）
              - `..._windows-x64.exe` / `..._windows-arm64.exe`：免安装单文件主程序（需系统已安装 WebView2）
              - preview/rc（非数字 pre-release）跳过 MSI，仅 NSIS + 单文件 exe
              - Windows ARM64 runner：`windows-11-arm`（公开仓库可用；MSI 不支持 ARM64）
            - macOS：`.dmg` / `.app`（未签名，Gatekeeper 会拦截；自动更新也可能受限制）
              1. 将 `Skill Manager.app` 拖到「应用程序」
              2. 若提示「已损坏，无法打开」或打不开：终端执行
                 `sudo codesign --force --deep --sign - /Applications/Skill\ Manager.app`
              3. 系统设置 → 隐私与安全性 → 点「仍要打开」或「允许」
              覆盖安装后若再次拦截，重复第 2、3 步。
            - Linux：`.AppImage` / `.deb`

            更新签名需仓库 Secrets：`TAURI_SIGNING_PRIVATE_KEY`（及可选密码）。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, '-rc') }}
          # preview/rc 的 Windows 跳过 MSI（WiX 不支持非数字 pre-release）
          args: ${{ matrix.args }}${{ startsWith(matrix.platform, 'windows') && (contains(github.ref_name, 'preview') || contains(github.ref_name, '-rc')) && ' --bundles nsis' || '' }}
          updaterJsonPreferNsis: true
          # 资源名带平台/架构，例如 Skill.Manager_*_windows-x64-setup.exe
          releaseAssetNamePattern: "[name]_[version]_[platform]-[arch][setup][ext]"

      # uploadPlainBinary 会把 [name] 固定为 binary，故改为手动上传以匹配 Skill.Manager_*_windows-{arch}.exe
      - name: Upload Windows portable exe
        if: startsWith(matrix.platform, 'windows')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$version" }
          $arch = '${{ matrix.portable_arch }}'
          if (-not $arch) { $arch = 'x64' }
          $targetDir = if ($arch -eq 'arm64') {
            'app/src-tauri/target/aarch64-pc-windows-msvc/release'
          } else {
            'app/src-tauri/target/release'
          }
          $candidates = @(
            (Join-Path $targetDir 'app.exe'),
            (Join-Path $targetDir 'Skill Manager.exe')
          )
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) {
            Get-ChildItem $targetDir -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "Windows portable exe not found in $targetDir"
          }
          $asset = "Skill.Manager_${version}_windows-$arch.exe"
          Copy-Item -LiteralPath $src -Destination $asset -Force
          gh release upload $tag $asset --clobber
          Write-Host "Uploaded $asset from $src"

  # GitHub /releases/latest 忽略 prerelease；rc 期间把 latest.json 滚到 preview 通道，
  # 正式版也会同步，避免预览通道用户停在旧 rc。
  publish-preview-updater:
    needs: publish-tauri
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Mirror latest.json to preview channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/updater
          gh release download "${{ github.ref_name }}" --pattern "latest.json" --dir /tmp/updater
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --prerelease --title "Preview updater channel" --notes "Rolling latest.json for in-app updater. Not a versioned app release."
          fi
          gh release upload preview /tmp/updater/latest.json --clobber
          echo "Mirrored latest.json from ${{ github.ref_name }} to preview"
