name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            # MSI/WiX 要求 pre-release 标识为纯数字（<=65535），如 0.8.0-1。
            # 含 preview/rc 字母时仅打 NSIS，避免整 job 失败。
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and upload release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Skill Manager ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}${{ (contains(github.ref_name, 'preview') || contains(github.ref_name, '-rc')) && ' (Preview)' || '' }}
          releaseBody: |
            Preview / 预览版：含尚未正式发布的功能，仅供测试。
            多平台安装包（Windows / macOS / Linux）：
            - Windows：
              - `..._windows-x64-setup.exe`：NSIS 安装包（正式版另有 `.msi`；支持应用内更新）
              - `..._windows-x64.exe`：免安装单文件主程序（需系统已安装 WebView2）
              - preview/rc（非数字 pre-release）跳过 MSI，仅 NSIS + 单文件 exe
            - macOS：`.dmg` / `.app`（未签名，首次打开需在「隐私与安全性」中允许；自动更新可能受 Gatekeeper 限制）
            - Linux：`.AppImage` / `.deb`

            更新签名需仓库 Secrets：`TAURI_SIGNING_PRIVATE_KEY`（及可选密码）。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, '-rc') }}
          # preview/rc 的 Windows 跳过 MSI（WiX 不支持非数字 pre-release）
          args: ${{ matrix.args }}${{ startsWith(matrix.platform, 'windows') && (contains(github.ref_name, 'preview') || contains(github.ref_name, '-rc')) && ' --bundles nsis' || '' }}
          updaterJsonPreferNsis: true
          # 资源名带平台/架构，例如 Skill.Manager_*_windows-x64-setup.exe
          releaseAssetNamePattern: "[name]_[version]_[platform]-[arch][setup][ext]"

      # uploadPlainBinary 会把 [name] 固定为 binary，故改为手动上传以匹配 Skill.Manager_*_windows-x64.exe
      - name: Upload Windows portable exe
        if: startsWith(matrix.platform, 'windows')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$version" }
          $candidates = @(
            'app/src-tauri/target/release/app.exe',
            'app/src-tauri/target/release/Skill Manager.exe'
          )
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) {
            Get-ChildItem 'app/src-tauri/target/release' -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw 'Windows portable exe not found in target/release'
          }
          $asset = "Skill.Manager_${version}_windows-x64.exe"
          Copy-Item -LiteralPath $src -Destination $asset -Force
          gh release upload $tag $asset --clobber
          Write-Host "Uploaded $asset from $src"
