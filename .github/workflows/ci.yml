name: ci

# 发版前拦住平台 cfg / 编译问题：不用完整 tauri build，只做 check + 单测。
# Windows ARM 仍由 release.yml 覆盖（cfg(windows) 在 windows-latest 即可发现）。
# Linux aarch64 用 ubuntu-22.04-arm 拦住 syscall / libc 架构差异。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: ubuntu-22.04-arm
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      # tauri-build / 部分依赖会读前端工程；与 release 保持一致先装好。
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app/src-tauri -> target
          shared-key: ci-${{ matrix.platform }}

      - name: Cargo check
        working-directory: app/src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: app/src-tauri
        run: cargo test --locked
